[project]
name = "axial-backend"
version = "0.1.0"
description = "Backend monolitico (API + procesamiento DICOM async) de Axial, plataforma de visualizacion volumetrica de CT"
requires-python = ">=3.12"
dependencies = [
    # --- lado API (antes api-repo) ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "uuid6>=2024.7.10",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "minio>=7.2",
    # --- lado processing (antes worker-repo) ---
    # sin celery[redis]: el procesamiento corre en el mismo proceso via
    # ProcessPoolExecutor (ver src/infrastructure/queue/in_process_task_queue.py),
    # no en un broker/servicio aparte.
    "numpy>=2.0",
    "pydicom>=3.0",
    "SimpleITK>=2.4",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Necesario para que los fixtures async de scope="session" (tests/integration/
# conftest.py: engine contra Postgres real) usen el MISMO event loop en toda
# la corrida -- ver README, hereda el mismo problema/solucion que tenia
# api-repo (worker-repo era sincrono de punta a punta y no lo necesitaba).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/infrastructure/db/migrations"]

[tool.mypy]
python_version = "3.12"
packages = ["src"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
